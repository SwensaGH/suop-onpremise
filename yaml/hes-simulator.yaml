apiVersion: v1
kind: Service
metadata:
  name: hes-simulator-service
  namespace: default
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: api
  selector:
    app: hes-simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hes-simulator-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hes-simulator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hes-simulator
    spec:
      containers:
        - name: hes-simulator
          image: swensadocker/utility-data-simulator:latest
          ports:
            - containerPort: 9090
              name: api
          env:
            - name: MDM_URL
              value: "http://mdm-service:8090"
            - name: UBS_URL
              value: "http://ubs-service:8080"
            - name: SEED_COUNT
              value: "100"
            - name: SEED_PER_CYCLE
              value: "100"
            - name: BACKFILL_DAYS
              value: "3"
            - name: FEED_INTERVAL_MINUTES
              value: "15"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service:9092
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
