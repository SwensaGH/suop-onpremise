apiVersion: v1
kind: Service
metadata:
  name: hes-simulator-service
  namespace: default
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: api
  selector:
    app: hes-simulator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hes-simulator-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hes-simulator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hes-simulator
    spec:
      containers:
        - name: hes-simulator
          image: swensadocker/utility-data-simulator:latest
          ports:
            - containerPort: 9090
              name: api
          env:
            - name: UBS_URL
              value: "http://ubs-service:8080"
            - name: MDM_URL
              value: "http://mdm-service:8090"
            - name: UBS_USER
              value: "admin"
            - name: UBS_PASS
              value: "Admin@123"
            - name: MDM_USER
              value: "admin"
            - name: MDM_PASS
              value: "admin123"
            - name: MDM_TENANT_ID
              value: "1"
            - name: MDM_TENANT_CODE
              value: "SERVEIZ"
            - name: SEED_COUNT
              value: "1"
            - name: SEED_PER_CYCLE
              value: "0"
            - name: FEED_METER_LIMIT
              value: "1"
            - name: RUN_SETUP_ON_START
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
